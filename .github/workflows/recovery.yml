name: recovery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[langgraph,dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - run: python -m resumeprobe run --adapters reference langgraph --repetitions 1 --output artifacts/ci
      - run: python -m resumeprobe http-run --repetitions 1 --output artifacts/http-ci
      - run: python -m build
