<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title"><title id="title">Sink transaction crash effects</title><rect width="960" height="390" rx="16" fill="#0a1324"/><g font-family="system-ui,sans-serif" fill="#e2e8f0"><text x="32" y="44" font-size="24" font-weight="700">The key and effect must survive together</text><text x="32" y="77" font-size="15">Observed process crashes inside the real SQLite sink transaction.</text><text x="32" y="128" font-size="16">before-key</text><rect x="220" y="106" width="140" height="32" rx="5" fill="#5eead4"/><text x="375" y="128" font-size="16">effects: 1, 1, 1</text><text x="32" y="178" font-size="16">after-key</text><rect x="220" y="156" width="140" height="32" rx="5" fill="#5eead4"/><text x="375" y="178" font-size="16">effects: 1, 1, 1</text><text x="32" y="228" font-size="16">after-commit</text><rect x="220" y="206" width="140" height="32" rx="5" fill="#5eead4"/><text x="375" y="228" font-size="16">effects: 1, 1, 1</text><text x="32" y="278" font-size="16">split-commit</text><rect x="220" y="256" width="280" height="32" rx="5" fill="#fb923c"/><text x="515" y="278" font-size="16">effects: 2, 2, 2</text><text x="32" y="358" font-size="14">split-commit is intentionally unsafe comparison code, not the real sink. No power-loss claim.</text></g></svg>