<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520"
role="img" aria-labelledby="title description"><title id="title">ResumeProbe crash recovery</title>
<desc id="description">Committed effects after a crash between effect commit and task persistence.
One effect is required. Counts are observed repetitions, not production reliability.</desc>
<rect width="960" height="520" rx="16" fill="#0a1324"/>
<g font-family="system-ui,sans-serif" fill="#e2e8f0">
<text x="32" y="40" font-size="24" font-weight="700">A successful resume can hide a duplicate</text>
<text x="32" y="70" font-size="15" fill="#bac7dc">
Crash: effect committed, task result not yet saved</text><text x="32" y="105" font-size="17" font-weight="700">reference</text><text x="32" y="145" font-size="15">naive</text><rect x="190" y="125" width="290" height="28" rx="5" fill="#fb923c"/><text x="495" y="145" font-size="15">effects: 2, 2, 2</text><text x="32" y="185" font-size="15">attempt-key</text><rect x="190" y="165" width="290" height="28" rx="5" fill="#fb923c"/><text x="495" y="185" font-size="15">effects: 2, 2, 2</text><text x="32" y="225" font-size="15">stable-key</text><rect x="190" y="205" width="145" height="28" rx="5" fill="#5eead4"/><text x="350" y="225" font-size="15">effects: 1, 1, 1</text><text x="32" y="280" font-size="17" font-weight="700">langgraph</text><text x="32" y="320" font-size="15">naive</text><rect x="190" y="300" width="290" height="28" rx="5" fill="#fb923c"/><text x="495" y="320" font-size="15">effects: 2, 2, 2</text><text x="32" y="360" font-size="15">attempt-key</text><rect x="190" y="340" width="290" height="28" rx="5" fill="#fb923c"/><text x="495" y="360" font-size="15">effects: 2, 2, 2</text><text x="32" y="400" font-size="15">stable-key</text><rect x="190" y="380" width="145" height="28" rx="5" fill="#5eead4"/><text x="350" y="400" font-size="15">effects: 1, 1, 1</text><text x="32" y="490" font-size="14" fill="#bac7dc">Observed local process experiments. One effect required; no semantic or remote service claim.</text></g></svg>