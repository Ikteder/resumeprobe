<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">Effects after a committed HTTP response is lost</title><rect width="960" height="440" rx="16" fill="#0a1324"/><g font-family="system-ui,sans-serif" fill="#e2e8f0"><text x="32" y="42" font-size="24" font-weight="700">A stable key stops helping when the server forgets it</text><text x="32" y="76" font-size="15">Real loopback sockets. First response dropped after effect commit.</text><text x="32" y="131" font-size="16">no-key</text><rect x="220" y="108" width="280" height="32" rx="5" fill="#fb923c"/><text x="515" y="131" font-size="16">effects: 2, 2, 2</text><text x="32" y="181" font-size="16">stable-key</text><rect x="220" y="158" width="140" height="32" rx="5" fill="#5eead4"/><text x="375" y="181" font-size="16">effects: 1, 1, 1</text><text x="32" y="231" font-size="16">attempt-key</text><rect x="220" y="208" width="280" height="32" rx="5" fill="#fb923c"/><text x="515" y="231" font-size="16">effects: 2, 2, 2</text><text x="32" y="281" font-size="16">pruned-key</text><rect x="220" y="258" width="280" height="32" rx="5" fill="#fb923c"/><text x="515" y="281" font-size="16">effects: 2, 2, 2</text><text x="32" y="331" font-size="16">payload-conflict</text><rect x="220" y="308" width="140" height="32" rx="5" fill="#5eead4"/><text x="375" y="331" font-size="16">effects: 1, 1, 1</text><text x="32" y="408" font-size="14">One effect required; payload conflict safely returns 409. Pruning is simulated, not provider timing.</text></g></svg>